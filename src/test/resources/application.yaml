# 테스트 전용 설정 (src/test/resources 가 클래스패스에서 우선하므로 main 설정을 대체한다).
#
# 목적: PostgreSQL·Redis·구글 OAuth 자격 증명 없이도 Spring 컨텍스트가 뜨게 하는 것.
# 실제 DB를 띄우지 않아도 `./gradlew build` 가 통과해야, 이후 리팩터링에서
# "내가 깨뜨린 것"과 "환경이 없어서 실패한 것"을 구분할 수 있다.
spring:
  application:
    name: backend-test

  datasource:
    # MODE=PostgreSQL: 운영 DB와 문법을 맞춰 두어야 엔티티 매핑 문제를 여기서 미리 잡는다.
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  # 실제 인증에 쓰이지 않는 더미 값. 빈 생성 시 @Value 주입만 만족시키면 된다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "test-client-id"
            client-secret: "test-client-secret"
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            authorization-grant-type: authorization_code

jwt:
  # HMAC-SHA 키는 32바이트 이상이어야 하므로 길이를 맞춘 더미 값을 쓴다.
  secret: test_secret_key_for_tests_only_do_not_use_in_production
  access-expiration: 3600000
  refresh-expiration: 1209600000

app:
  internal-api:
    allowed-cidrs: 127.0.0.1/32,::1/128
  cors:
    allowed-origin-patterns: "*"
