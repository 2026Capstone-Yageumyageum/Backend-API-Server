spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    # 기본값 없음: 환경변수 미설정 시 앱이 시작 단계에서 바로 실패하도록 한다.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            authorization-grant-type: authorization_code

jwt:
  secret: ${JWT_SECRET_KEY:default_secret_key_over_32_characters_long}
  access-expiration: 3600000        # 1시간
  refresh-expiration: 1209600000   # 14일

app:
  python-analysis:
    # 파이썬 분석 서버 주소. 이전에는 WebClientConfig에 하드코딩되어 있었다.
    base-url: ${PYTHON_ANALYSIS_URL:http://127.0.0.1:5020}
    connect-timeout-seconds: 10
    # 영상 분석은 길게 걸리므로 넉넉히 두되, 무한 대기는 커넥션 고갈로 이어지므로 반드시 상한을 둔다.
    response-timeout-minutes: 10
  internal-api:
    # /api/internal/** 을 호출할 수 있는 출발지 대역.
    # 파이썬 분석 서버가 인증 헤더 없이 레퍼런스 API를 호출하므로(pro_cache.py) 토큰 대신 IP로 제한한다.
    # 기본값은 같은 호스트에서 함께 도는 현재 구성 기준이며, 도커·사설망으로 분리하면 대역을 추가한다.
    allowed-cidrs: ${INTERNAL_ALLOWED_CIDRS:127.0.0.1/32,::1/128}
    # 설정하면 IP 검사에 더해 X-Internal-Api-Key 헤더가 이 값과 같아야 한다.
    # 비워 두면 IP만 본다(로컬 개발 기본값). 코드스페이스처럼 외부 요청이 localhost로
    # 들어오는 환경에서는 IP가 의미를 잃으므로 반드시 설정한다.
    key: ${INTERNAL_API_KEY:}
  cors:
    # allowCredentials=true 와 "*" 조합은 사실상 모든 출처에 인증 정보 포함 요청을 허용한다.
    # 운영 배포 시에는 반드시 앱·웹 출처를 명시할 것.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
